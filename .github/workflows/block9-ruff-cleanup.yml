name: Block 9 Ruff cleanup

on:
  push:
    branches:
      - feat/v11-block9-installed-desktop-scientific-e2e-acceptance

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[block9-ruff-cleanup-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove confirmed unused fixture imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ui/desktop/packaging/installed_acceptance_fixture.py')
          text = path.read_text(encoding='utf-8')
          names = (
              'VaspEnergySummary',
              'VaspFrequencyDataset',
              'VaspResultDocument',
              'VaspResultSource',
              'VaspResultSourceRole',
          )
          for name in names:
              old = f'    {name},\n'
              if text.count(old) != 1:
                  raise RuntimeError(f'{name}: expected exactly one import, found {text.count(old)}')
              text = text.replace(old, '', 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
          python -m pip install ruff
          ruff check ui/desktop/packaging/installed_acceptance_fixture.py tests/test_v11_durable_artifact_byte_identity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/desktop/packaging/installed_acceptance_fixture.py
          git commit -m "[block9-ruff-cleanup-applied] test: remove stale fixture imports"
          git push origin HEAD:feat/v11-block9-installed-desktop-scientific-e2e-acceptance
