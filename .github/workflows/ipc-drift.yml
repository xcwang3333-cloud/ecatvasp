name: IPC v2 Drift Governance

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ipc-drift:
    name: Validate IPC v2 operation contract parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run IPC contract governance tests
        run: pytest tests/ipc/test_operation_catalog_sync.py
