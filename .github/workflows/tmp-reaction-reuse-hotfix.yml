name: Temporary reaction reuse hotfix

on:
  push:
    branches:
      - feat/v11-block9-installed-desktop-scientific-e2e-acceptance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v11-block9-installed-desktop-scientific-e2e-acceptance
          fetch-depth: 0
      - name: Apply exact anchored patch and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ecatvasp/api/_reaction_workspace_core.py')
          text = path.read_text(encoding='utf-8')
          old = '        expected_descriptors = _json_value(prepared.descriptors)\n'
          new = (
              '        expected_descriptors = _json_value(\n'
              '            tuple(sorted(prepared.descriptors, key=lambda item: item.key))\n'
              '        )\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one reuse-descriptor anchor, got {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/tmp-reaction-reuse-hotfix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ecatvasp/api/_reaction_workspace_core.py
          git commit -m 'fix: normalize reaction descriptors before reuse matching'
          git push origin HEAD:feat/v11-block9-installed-desktop-scientific-e2e-acceptance
