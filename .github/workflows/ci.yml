name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Test
        run: pytest

  matterviz-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/matterviz-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install MatterViz 0.6.0 contract dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck MatterViz public contract
        run: npm run check

  desktop-shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck desktop shell
        run: npm run check
      - name: Test typed desktop contract
        run: npm test
      - name: Build Svelte frontend
        run: npm run build
      - name: Test Tauri transport guards
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Check Tauri desktop crate
        run: cargo check --manifest-path src-tauri/Cargo.toml

  windows-packaging:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ui/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ui/desktop/packaging/requirements-windows.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python backend and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../..
          python -m pip install -r packaging/requirements-windows.txt
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Build frozen Windows backend
        run: npm run build:windows-sidecar
      - name: Final E2E smoke of frozen backend and ProjectStore drift
        run: >-
          python packaging/smoke_frozen_backend.py
          src-tauri/binaries/ecatvasp-desktop-backend-x86_64-pc-windows-msvc.exe
      - name: Typecheck desktop shell
        run: npm run check
      - name: Test typed desktop contract
        run: npm test
      - name: Build Svelte frontend
        run: npm run build
      - name: Test Tauri transport guards with bundled sidecar config
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Tauri Windows NSIS package
        run: npm run tauri build -- --bundles nsis
      - name: Verify packaged Windows outputs
        shell: pwsh
        run: |
          $app = "src-tauri/target/release/ecatvasp-desktop.exe"
          $sidecar = "src-tauri/target/release/ecatvasp-desktop-backend.exe"
          if (-not (Test-Path $app)) { throw "packaged desktop executable is missing" }
          if (-not (Test-Path $sidecar)) { throw "bundled Python sidecar is missing" }
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
            Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer is missing" }
          Write-Host "Packaged desktop: $app"
          Write-Host "Bundled backend: $sidecar"
          Write-Host "NSIS installer: $($installer.FullName)"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ecatvasp-windows-nsis
          path: ui/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
