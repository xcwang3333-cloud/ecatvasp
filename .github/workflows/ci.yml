name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Test
        run: pytest

  matterviz-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/matterviz-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install MatterViz 0.6.0 contract dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck MatterViz public contract
        run: npm run check

  desktop-shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck desktop shell
        run: npm run check
      - name: Test typed desktop contract
        run: npm test
      - name: Build Svelte frontend
        run: npm run build
      - name: Test Tauri transport guards
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Check Tauri desktop crate
        run: cargo check --manifest-path src-tauri/Cargo.toml
